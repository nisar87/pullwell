<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d8d80'/%3E%3Cpath d='M16 7v13m0 0l-5.5-5.5M16 20l5.5-5.5M9 25h14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 7.5v12.5m0 0l-5-5m5 5l5-5M9.5 24.5h13" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>{{NAME}}</span></div>
    <nav class="mb" id="menubar" role="menubar" aria-label="Menu">
      <button role="menuitem" aria-haspopup="menu" data-mb="tasks"><u>T</u>asks</button>
      <button role="menuitem" aria-haspopup="menu" data-mb="downloads"><u>D</u>ownloads</button>
      <button role="menuitem" aria-haspopup="menu" data-mb="view"><u>V</u>iew</button>
      <button role="menuitem" aria-haspopup="menu" data-mb="tools">T<u>o</u>ols</button>
      <button role="menuitem" aria-haspopup="menu" data-mb="help"><u>H</u>elp</button>
    </nav>
    <span class="sp"></span>
    <input class="search" id="search" type="search" placeholder="Search downloads (Ctrl+F)" aria-label="Search downloads" spellcheck="false" autocomplete="off">
  </header>
  <div class="tb" role="toolbar" aria-label="Commands">
    <button class="tbtn pri" data-tb="add" title="Add a download (Ctrl+N, or Ctrl+V with a link copied)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New download</span></button>
    <button class="tbtn" data-tb="resume" title="Resume the selected downloads (Space)" disabled><svg viewBox="0 0 24 24"><path d="M8 5.5l10.5 6.5L8 18.5z"/></svg><span>Resume</span></button>
    <button class="tbtn" data-tb="stop" title="Stop the selected downloads (Space)" disabled><svg viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12"/></svg><span>Stop</span></button>
    <button class="tbtn" data-tb="del" title="Delete the selected downloads (Del)" disabled><svg viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12h9l1-12M9.5 7V4.5h5V7"/></svg><span>Delete</span></button>
    <span class="sep"></span>
    <button class="tbtn quiet" data-tb="startall" title="Resume every stopped download" disabled><svg viewBox="0 0 24 24"><path d="M4.5 6l7 6-7 6zM13 6l7 6-7 6z"/></svg><span>Start all</span></button>
    <button class="tbtn quiet" data-tb="stopall" title="Stop every download" disabled><svg viewBox="0 0 24 24"><path d="M5 6v12M10 6v12M15 6v12M20 6v12"/></svg><span>Stop all</span></button>
    <button class="tbtn quiet" data-tb="delfin" title="Remove all finished downloads from the list (the files stay)" disabled><svg viewBox="0 0 24 24"><path d="M5 12.5l4 4L19 6.5"/><path d="M4 20h16"/></svg><span>Clear finished</span></button>
    <span class="sp"></span>
    <button class="tbtn quiet" data-tb="queues" title="Queues and their hours"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Scheduler</span></button>
    <button class="tbtn quiet" data-tb="grab" title="Find the files a web page links to"><svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg><span>Grab links</span></button>
    <button class="tbtn quiet" data-tb="opts" title="Options"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Options</span></button>
  </div>
  <div id="banner"></div>
  <div class="body">
    <nav class="side" id="side" aria-label="Categories"></nav>
    <section class="list" id="list" aria-label="Downloads">
      <table class="dl" id="tbl"><colgroup id="cg"></colgroup><thead id="th"></thead><tbody id="tb"></tbody></table>
      <div class="empty" id="empty" hidden></div>
    </section>
  </div>
  <footer class="sb" id="status" role="status"></footer>
</div>
<input type="file" id="torFile" accept=".torrent,application/x-bittorrent" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// Set by the program when it serves this page.
const APP = {name: '{{NAME}}', header: '{{HEADER}}', version: '{{VERSION}}', build: '{{BUILD}}', host: '{{HOST}}', repo: '{{REPO}}'};
</script>
<script src="downloads-more.js"></script>
<script src="app.js"></script>
</body>
</html>
