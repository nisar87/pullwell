<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311161d'/%3E%3Cpath d='M16 7v13m0 0l-5-5m5 5l5-5M9 25h14' stroke='%2333d6c4' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Styles copied from NetMerge's ui/index.html (3.11.20), which the downloads page was built with. -->
<style>
:root{
  color-scheme:dark;
  --bg:#0a0d12; --side:#0d1117; --panel:#131921; --panel2:#18202a; --inset:#0e131a; --line:#232d39; --line2:#2f3c4b;
  --text:#e8eef5; --mute:#93a1b1; --dim:#64717f;
  --accent:#2fd4c2; --accent-ink:#03201c; --accent-soft:#2fd4c21c;
  --good:#3ddc84; --warn:#f5b84a; --bad:#ff6b6b; --info:#5ab0ff;
  --l1:#2fd4c2; --l2:#f5b84a; --l3:#a78bfa; --l4:#5ab0ff; --l5:#ff8fb1;
  --shadow:0 12px 32px #0007;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5f8; --side:#ffffff; --panel:#ffffff; --panel2:#f6f8fb; --inset:#eef2f6; --line:#e1e6ed; --line2:#cfd7e1;
  --text:#18212b; --mute:#566474; --dim:#8794a3;
  --accent:#0e9f90; --accent-ink:#ffffff; --accent-soft:#0e9f9016;
  --good:#16a35a; --warn:#c77d0a; --bad:#d63b3b; --info:#2570d4;
  --l1:#0e9f90; --l2:#d98a0b; --l3:#7c5cd6; --l4:#2570d4; --l5:#d6407a;
  --shadow:0 12px 32px #1a2b4018;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    color-scheme:light;
    --bg:#f3f5f8; --side:#ffffff; --panel:#ffffff; --panel2:#f6f8fb; --inset:#eef2f6; --line:#e1e6ed; --line2:#cfd7e1;
    --text:#18212b; --mute:#566474; --dim:#8794a3;
    --accent:#0e9f90; --accent-ink:#ffffff; --accent-soft:#0e9f9016;
    --good:#16a35a; --warn:#c77d0a; --bad:#d63b3b; --info:#2570d4;
    --l1:#0e9f90; --l2:#d98a0b; --l3:#7c5cd6; --l4:#2570d4; --l5:#d6407a;
    --shadow:0 12px 32px #1a2b4018;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.spacer{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;font-weight:680;font-size:17px;letter-spacing:.1px}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:560;text-align:left}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.sel{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.side-foot b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}
main{padding:22px 30px 48px;max-width:1240px;width:100%}
.bar{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.bar h1{font-size:22px;margin:0;font-weight:680;letter-spacing:-.01em}
.bar .sub{color:var(--mute);font-size:13px}

/* ---------- power ---------- */
.power{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 18px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);user-select:none;transition:.2s}
.power b{font-weight:620;min-width:92px;text-align:right}
.power .sw{width:54px;height:30px;border-radius:99px;background:var(--line2);position:relative;transition:.25s}
.power .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px #0005}
.power.is-on{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.power.is-on .sw{background:var(--accent)}
.power.is-on .sw::after{left:27px}
.power.busy{opacity:.6;pointer-events:none}

/* ---------- common ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:650}
.card p.d{margin:0 0 14px;color:var(--mute);font-size:13px}
.sec{display:flex;align-items:flex-end;gap:12px;margin:28px 0 12px}
.sec h2{font-size:16px;margin:0;font-weight:650}
.sec .hint{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 16px;border-radius:10px;font-weight:580;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.inp,.sel{background:var(--inset);border:1px solid var(--line2);border-radius:10px;padding:8px 12px}
.inp{min-width:230px} .sel{cursor:pointer;min-width:190px}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent)}
.seg{display:inline-flex;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:9px;color:var(--mute);font-weight:580}
.seg button.sel{background:var(--panel);color:var(--text);box-shadow:0 1px 3px #0003,inset 0 0 0 1px var(--line2)}
.tog{width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;border:0;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0004}
.tog.on{background:var(--c,var(--accent))} .tog.on::after{left:21px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--mute)) 14%,transparent);color:var(--c,var(--mute))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mute))}
.tag.dim{opacity:.55}
.tag{font-variant-numeric:tabular-nums;min-width:62px;text-align:center;font-size:12px;color:var(--mute);background:var(--inset);border:1px solid var(--line);padding:2px 9px;border-radius:99px;font-family:var(--mono)}
.x{border:0;background:none;color:var(--dim);padding:0 0 0 7px;font-size:15px;line-height:1}
.x:hover{color:var(--bad)}
.note{padding:12px 16px;border-radius:12px;font-size:13.5px;margin:0 0 16px;display:flex;gap:12px;align-items:center;border:1px solid}
.note.warn{background:color-mix(in srgb,var(--warn) 11%,transparent);border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.note.bad{background:color-mix(in srgb,var(--bad) 11%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent);white-space:pre-wrap}
.note.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.note b{font-weight:650}

/* ---------- overview hero ---------- */
.hero{display:grid;grid-template-columns:290px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hero-l{padding:22px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:650}
.big{font-size:58px;line-height:1;font-weight:600;margin-top:6px}
.big small{font-size:18px;color:var(--mute);margin-left:7px;font-family:var(--sans);font-weight:500;letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv span{display:block;font-size:12px;color:var(--mute)}
.kv b{font-family:var(--mono);font-weight:500;font-size:15px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend div{display:flex;align-items:center;gap:9px;color:var(--mute)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--text)}
.hero-r{position:relative;min-height:268px}
.hero-r canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-note{position:absolute;left:18px;top:10px;font-size:12px;color:var(--dim);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow);min-width:150px;z-index:3}
.tip div{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.tip .t{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;font-weight:600}

/* ---------- connection cards ---------- */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lk{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:opacity .2s}
.lk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.lk.off{opacity:.6} .lk.off::before{background:var(--dim)}
.lk-h{display:flex;align-items:center;gap:12px}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.ico svg{width:21px;height:21px}
.lbl{font-weight:650;font-size:15.5px;background:transparent;border:1px solid transparent;border-radius:7px;padding:1px 5px;margin-left:-6px;width:100%;min-width:0}
.lbl:hover{border-color:var(--line2)} .lbl:focus{outline:none;border-color:var(--accent);background:var(--inset)}
.desc{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.lk-s{display:flex;align-items:baseline;gap:7px;margin:16px 0 0}
.lk-s .num{font-size:32px;font-weight:600}
.lk-s small{color:var(--mute)}
.lk-s .up{margin-left:auto;color:var(--mute);font-size:12.5px;font-family:var(--mono)}
.spark{width:100%;height:50px;display:block;margin:8px 0 10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meta>span[data-f=tags]{display:contents!important}
.meta .chip,.meta .tag{min-width:0;width:100%;box-sizing:border-box;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .meta{margin-bottom:14px}
.lk .share{margin-top:auto}
.lk .share,.lk .role{display:block}
.share-h{min-height:32px}
.role{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.share{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2)}
.lk>[data-f=missing]{min-height:0}
.share-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:8px}
.share-h b{color:var(--text);font-family:var(--mono);font-weight:600;margin-left:6px}
.share-bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden}
.share-bar div{height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.step{display:flex;align-items:center;gap:3px}
.step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);line-height:1;font-size:16px}
.step button:hover{border-color:var(--c)}
.step button:disabled{opacity:.35;cursor:default}
.step b{min-width:42px;text-align:center}
.warn-line{color:var(--warn);font-size:12.5px;margin-top:10px}
.modebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.modebox .d{color:var(--mute);font-size:13px}

.navbadge{margin-left:auto;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat{display:flex;gap:34px;flex-wrap:wrap;margin-top:6px}
.stat small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.pack{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.pack:last-child{border-bottom:0}
.pack .t{flex:1;min-width:0}.pack .t b{display:block}.pack .t span{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.pack .m{color:var(--dim);font-size:12.5px;text-align:right;white-space:nowrap}
textarea.inp{width:100%;min-height:140px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.scrollbox{height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.scrollbox .tbl{border:0;border-radius:0}
.scrollbox .tbl th{position:sticky;top:0;z-index:1}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.sm{padding:4px 11px;font-size:12.5px}
/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;font-weight:650;padding:11px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tbl td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num{width:112px}
.proc{font-weight:600}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--inset);min-width:120px;max-width:200px}
.split i{display:block;height:100%}
.empty{padding:30px;text-align:center;color:var(--mute)}
.listchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.listchips .tag{font-size:12.5px;padding:4px 7px 4px 12px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}
.opt:first-child{padding-top:2px} .opt:last-child{border-bottom:0;padding-bottom:2px}
.opt b{font-weight:610;display:block} .opt span{color:var(--mute);font-size:13px}

/* ---------- speed test ---------- */
.bars{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.bar-r{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:16px}
.bar-r .t{font-weight:580} .bar-r .t small{display:block;color:var(--dim);font-family:var(--mono);font-size:11.5px;font-weight:400}
.track{height:12px;border-radius:99px;background:var(--inset);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-r .v{text-align:right;font-family:var(--mono);font-size:16px}
.progress{height:5px;background:var(--inset);border-radius:99px;overflow:hidden;margin-top:16px}
.progress div{height:100%;background:var(--accent);transition:width .4s}
pre.log{background:var(--inset);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:12px/1.55 var(--mono);color:var(--mute);height:440px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:14px 0 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow);z-index:20;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);align-items:center;gap:4px}
  .brand{padding:0 10px 0 4px} .brand span,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  main{padding:16px 16px 40px}
  .hero{grid-template-columns:1fr} .hero-l{border-right:0;border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .bar-r{grid-template-columns:110px 1fr 84px}
  .bar{flex-wrap:wrap} .power b{min-width:0}
}
.usgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.us{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-left:4px solid var(--c,var(--accent))}
.us .n{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:650}
.us .v{font-size:26px;font-weight:700;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.us .s{color:var(--mute);font-size:12.5px;margin-top:6px}
.us .share-bar>div{height:100%;background:var(--c,var(--accent))}
.us.out .v{color:var(--bad)}
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.qrow b{min-width:120px}
.qrow .inp{min-width:0;width:130px}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.today td{background:var(--accent-soft)}
.tbl th.grp{text-align:center;border-bottom:3px solid var(--c,var(--line2))}
.tbl th.tot,.tbl td.tot{border-left:1px solid var(--line2)}
.tbl tr.sub th{text-transform:none;letter-spacing:0;font-size:12px;padding:6px 12px}
.tbl td.num{padding-left:10px;padding-right:10px}
#usTbl{min-width:640px}
#usTbl td:first-child{white-space:nowrap}
.shk{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.shk:last-child{border-bottom:0}
.shk span{color:var(--mute)}
.shk code{font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:650;user-select:all}
.qrs{display:flex;gap:28px;flex-wrap:wrap}
.qrc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.qrc canvas{width:220px;height:220px;border-radius:12px;border:1px solid var(--line2)}
.qrc code{font-size:11px;color:var(--mute);max-width:240px;word-break:break-all}
.shsteps{margin:6px 0 0;padding-left:20px;color:var(--mute);line-height:1.7}
.shsteps b{color:var(--text)}
.shhero{display:flex;align-items:center;gap:16px;padding:18px 22px;margin-bottom:16px}
.shic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.shsub{color:var(--mute);font-size:13.5px;margin-top:2px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim)}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.updb{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-color:var(--accent)}
.role label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);min-height:32px}
.role .sel{min-width:0;width:210px;max-width:62%;font-size:12.5px;padding:5px 8px}
.role .hint2{margin-top:2px}
.pr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pr .pc{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.pr .pc.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.pr .pc h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pr .pc p{margin:0;color:var(--mute);font-size:13px;flex:1}
.pr .pc .row{gap:8px}
.sechead{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:4px 0 8px}
.sechead span{font-weight:500;text-transform:none;letter-spacing:0;margin-left:8px;color:var(--dim)}
.rec{font-style:normal;font-weight:600;font-size:11px;color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);padding:2px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
details.adv>summary{cursor:pointer;list-style:none;padding:2px 0}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:'Show';float:right;color:var(--mute);font-size:13px}
details.adv[open]>summary::after{content:'Hide'}
.hi-day{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:14px 0 6px}
.hi-day:first-child{padding-top:0}
.hi-row{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.hi-row time{flex:none;width:64px;color:var(--mute);font-variant-numeric:tabular-nums}
.hi-row i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--info);align-self:center}
.hi-row i.good{background:var(--good)}.hi-row i.warn{background:var(--warn)}.hi-row i.bad{background:var(--bad)}
.dnsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dnsrow:first-of-type{border-top:0}
.dnsrow b{font-size:14px}.dnsrow .d{font-size:13px;color:var(--mute);grid-column:1}
.dnswarn{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
.dnsrec{border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin:14px 0;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.dnstbl{width:100%;border-collapse:collapse;font-size:13px}
.dnstbl th{text-align:left;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.dnstbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.dnstbl .n{text-align:right;font-variant-numeric:tabular-nums}
.dnstbl tr.best td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.dnsprog{height:8px;border-radius:99px;background:var(--inset);overflow:hidden;margin:10px 0}
.dnsprog div{height:100%;background:var(--accent);transition:width .3s}
.wiz{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.wiz .card{max-width:520px;width:100%;box-shadow:0 20px 60px #0006}
.wiz ol{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px}
.wiz li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.wiz li i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--inset);border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px}
.wiz li i.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#histSvg{width:100%;height:150px;display:block}
.act{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:13.5px;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .at{color:var(--dim);font-family:var(--mono);font-size:12px;flex:none}
.act .dot{flex:none;align-self:center}
.dot.warn{background:var(--warn)}
.fc{margin-top:4px}.fc.bad{color:var(--warn)}
.dot.bad{background:var(--bad)}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)}
.shgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.shgrid{grid-template-columns:1fr}}
.shsteps2{display:flex;flex-direction:column;gap:14px}
.stp{display:flex;gap:14px}
.stp i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13.5px;margin-top:1px}
.stp>div>b{display:block}
.hint2{color:var(--mute);font-size:13px;line-height:1.55}
.qrbox{align-self:center;background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 24px #0002,0 0 0 1px var(--line)}
.qrbox canvas{display:block;width:260px;height:260px}
.qrmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.qrmeta .sel{min-width:0}
.tips{margin:0;padding-left:18px;color:var(--mute);font-size:13px;line-height:1.75}
.tips b{color:var(--text)}
.dev{display:flex;align-items:center;gap:12px;padding:8px 0}
.dev .dic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
.dname{display:flex;align-items:center;gap:8px}
.lnk{background:none;border:0;color:var(--accent);font-size:12.5px;cursor:pointer;padding:0}
.lnk:hover{text-decoration:underline}
.dev .num{font-size:20px;font-weight:700}
.dev small{font-size:11px;color:var(--mute);font-weight:500}
details.adv{padding:14px 18px}
details.adv summary{cursor:pointer;font-weight:650;padding:2px 0;list-style:none}
details.adv summary::before{content:"▸ ";color:var(--mute)}
details.adv[open] summary::before{content:"▾ "}
.shoff{text-align:center;padding:42px 20px}
.shoff .big{font-size:40px;margin-bottom:8px}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;padding:10px 22px}
main{margin:0 auto}
</style>

<body>
<main>
  <div class="bar">
    <div><h1 id="pageTitle">{{NAME}}</h1><div class="sub" id="pageSub">Downloads</div></div>
    <div class="spacer"></div>
    <div class="seg" id="theme" aria-label="Appearance"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  </div>
  <div id="hostNote"></div>
  <section class="page" id="pg-downloads"><div id="dlBody"></div></section>
  <div class="hint2" style="margin-top:28px;text-align:center">{{NAME}} {{VERSION}}</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// Set by the program when it serves this page.
const APP = {name: '{{NAME}}', header: '{{HEADER}}', version: '{{VERSION}}', host: '{{HOST}}', ext: false};

// Helpers the downloads page uses (copied from NetMerge's ui/index.html).
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes = b => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(1)+' MB' : (b/1e3).toFixed(0)+' KB';
const dur = s => { if (!s) return '—'; const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h ? `${h}h ${m}m` : m ? `${m}m ${s%60}s` : `${s}s`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const setHTML = (el, html) => { if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; } };
let toastT;
function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2800); }
async function api(path, body){
  const r = await fetch('/api/'+path, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json',[APP.header]:'1'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

// This program has one page and one connection (NetMerge, if it runs, merges lines underneath).
let page = 'downloads';
const S = null;
const go = () => { page = 'downloads'; if (typeof loadDL === 'function') loadDL(true); };
const colorOf = () => css('--accent');
const labelOf = name => name;

function applyTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch(e){} $$('#theme button').forEach(b => b.classList.toggle('sel', b.dataset.v === t)); }
try { applyTheme(localStorage.getItem('theme') || 'auto'); } catch(e){ applyTheme('auto'); }
$$('#theme button').forEach(b => b.onclick = () => applyTheme(b.dataset.v));
if (APP.host === 'browser') $('#hostNote').innerHTML = `<div class="note" style="margin-bottom:14px">${esc(APP.name)} is shown in your web browser because no app window could be opened. Closing this tab does not stop downloads.</div>`;
</script>
<script src="downloads-more.js"></script>
<script src="downloads.js"></script>
<script>loadDL(true);</script>
</body>
