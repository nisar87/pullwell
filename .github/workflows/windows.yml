name: Windows
# The program on a real Windows machine: the tests, then scripts/wintest drives the built program through its command
# line and local API (single instance, links, Start with Windows, Start menu, pullwell:// link, self-update and
# Go back, keeping the PC awake, a protected folder, Uninstall). No desktop is needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Tests (program)
        run: go test -count=1 .
      - name: Tests (download engine)
        run: go test -count=1 -timeout 30m ./dm/
      - name: Build two versions of the program
        shell: bash
        run: |
          go run ./scripts/mkres
          name=$(sed -n 's/^const AppName = "\(.*\)"/\1/p' appname.go)
          echo "NAME=$name" >> "$GITHUB_ENV"
          go build -ldflags "-H=windowsgui -X main.appBuild=wintest1" -o "$RUNNER_TEMP/build1.exe" .
          go build -ldflags "-H=windowsgui -X main.appBuild=wintest2" -o "$RUNNER_TEMP/build2.exe" .
      - name: Drive the program
        shell: bash
        run: go run ./scripts/wintest -exe "$RUNNER_TEMP/build1.exe" -exe2 "$RUNNER_TEMP/build2.exe" -name "$NAME"
