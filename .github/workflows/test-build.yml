name: Test build
# Every push to main replaces the pre-release "test-build" with a fresh Pullwell.exe (and its .sha256), so the
# latest code can be tried on a Windows PC. It is marked pre-release and is not an update anybody is offered.
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: test-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.appBuild=$(git rev-parse --short HEAD)" -o Pullwell.exe .
          sha256sum Pullwell.exe | cut -d' ' -f1 > Pullwell.exe.sha256
          cat Pullwell.exe.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          gh release create test-build Pullwell.exe Pullwell.exe.sha256 --prerelease --target "$GITHUB_SHA" \
            --title "Test build $(git rev-parse --short HEAD)" \
            --notes "Built from $(git rev-parse --short HEAD) for testing on Windows. Not a release."
